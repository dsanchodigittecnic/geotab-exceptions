<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Geotab Exceptions Add-In</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
</head>
<body>
  <main class="container">
    <h1>Reporte de Excepciones por Grupo</h1>
    <p class="subtitle">Versión add-in basada en la lógica de app3.py</p>

    <form id="report-form" class="panel">
      <label>
        Grupo
        <select id="groupInput" required>
          <option value="b2B01">b2B01 -> toma de fuerza por FMS</option>
          <option value="b2B02" selected>b2B02 -> toma de fuerza por AUX</option>
        </select>
      </label>

      <div class="row">
        <label>
          Desde (UTC)
          <input id="fromInput" type="datetime-local" required />
        </label>
        <label>
          Hasta (UTC)
          <input id="toInput" type="datetime-local" required />
        </label>
      </div>

      <label class="check">
        <input id="includeSubgroupsInput" type="checkbox" />
        Incluir subgrupos
      </label>

      <label>
        Nombre de archivo (opcional)
        <input id="outFileInput" type="text" placeholder="geotab_reporte.xlsx" />
      </label>

      <div class="actions">
        <button id="runBtn" type="submit">Generar Excel</button>
        <button id="tableBtn" type="button">Generar tabla</button>
      </div>
    </form>

    <section class="panel">
      <h2>Tabla de datos</h2>
      <div id="tableLoading" class="table-loading hidden">
        <span class="spinner" aria-hidden="true"></span>
        Procesando datos, espera...
      </div>
      <div id="tableContainer" class="table-empty">Pulsa "Generar tabla" para ver resultados.</div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
